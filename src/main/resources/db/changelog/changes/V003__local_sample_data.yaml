  # Site settings: copied from the web app's fixture (src/app/core/fixtures/
  # public-fixtures.ts), whose values follow BRASETH's own preview page. Staff
  # enter the real settings from the settings screen in every other
  # environment. The fixture's placeholder client logos and reviews are NOT
  # copied: they are marked BUSINESS_OWNER_CONFIRMATION_REQUIRED.
  - changeSet:
      id: V003-03-local-site-settings
      author: braseth
      context: local
      changes:
        - sql:
            sql: |
              UPDATE site_settings SET
                company_name = 'BRASETH T-Shirt Printing Co., Ltd.',
                legal_name = 'BRASETH T-Shirt Printing House Co., Ltd.',
                phones = '["+855 98 858 859", "+855 98 857 859", "+855 99 858 859", "+855 85 777 585"]',
                email = 'sale@braseth-supply.com',
                telegram = '+85598858859',
                address = '{"line1": "No. 319, Prek Toal Village", "line2": "Sangkat Steung Meanchey, Khan Meanchey", "city": "Phnom Penh", "country": "Cambodia"}',
                map_embed_url = 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3907.3337030498183!2d104.78809297481901!3d11.67074588853765!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31094de170a4b899%3A0x4dc07df31e1bd2f2!2sBRASETH%20T-Shirt%20%7C%20Screen%20Printing%20%26%20Promotional%20Items!5e0!3m2!1sen!2skh!4v1789734519665!5m2!1sen!2skh',
                business_hours = (
                  SELECT jsonb_agg(jsonb_build_object('day', d, 'opensAt', '08:00', 'closesAt', '18:00',
                                                      'breakStartsAt', '12:00', 'breakEndsAt', '13:00', 'closed', false)
                                   ORDER BY d)
                  FROM generate_series(1, 6) AS d
                ) || '[{"day": 0, "opensAt": null, "closesAt": null, "closed": true}]'::jsonb,
                trust_stats = '[
                  {"id": "since", "label": "Printing since", "value": "2012", "caption": "Our own workshop in Phnom Penh"},
                  {"id": "items", "label": "Items in store", "value": "100+", "caption": "Apparel, bags, pens, drinkware"},
                  {"id": "moq", "label": "Apparel minimum", "value": "100 pcs", "caption": "Or negotiate"},
                  {"id": "design", "label": "Artwork design", "value": "Free", "caption": "We make your logo print-ready"}
                ]',
                reviews_url = 'https://www.google.com/maps/search/?api=1&query=BRASETH%20T-Shirt%20Screen%20Printing%20%26%20Promotional%20Items',
                site_text = jsonb_build_object('en', jsonb_build_object(
                  'tagline', 'Custom apparel printing, promotional products and silkscreen materials, made in Phnom Penh.',
                  'about', jsonb_build_object(
                    'intro', 'BRASETH T-Shirt Printing House Co., Ltd. was established in late 2012. Our office and workshop are near Steung Meanchey bridge in Phnom Penh, where our team silk-screens, embroiders and heat-presses every order.',
                    'story', 'Our goal is to be Cambodia’s first choice for silkscreen printing and premium gifts: good quality, attention to detail and fair prices.',
                    'mission', 'Build lasting relationships with clients, deliver every job at the highest level of craftsmanship, and keep improving our products and service.',
                    'vision', 'To become the number one silkscreen and premium gifts supplier in Cambodia.',
                    'capability', 'Custom t-shirts, polos, caps and 100+ promotional items, silk-screened and embroidered in our own workshop. We also sell the materials we print with, retail and wholesale — over 100 items for print shops.',
                    'quality', 'Send your logo and we prepare the artwork for free. You approve the visual before anything is printed, and a free sample is made once you confirm your quote.')))
              WHERE id = 1;
      rollback:
        - sql:
            sql: UPDATE site_settings SET company_name = 'BRASETH' WHERE id = 1;

  # Services and portfolio: placeholders, named "Sample", prose CONFIGURE_ME.
  # One of each is a draft, and one project names a client without
  # permission, so the public API can be seen to hide both.
  - changeSet:
      id: V003-04-local-sample-services
      author: braseth
      context: local
      changes:
        - sql:
            sql: |
              INSERT INTO services (slug, status, method, photos, applicable_category_slugs, service_text, process, position)
              SELECT v.slug, v.status, v.method, v.photos::jsonb, v.categories::jsonb,
                     jsonb_build_object('en', jsonb_build_object(
                       'name', v.name, 'shortDescription', 'CONFIGURE_ME', 'description', 'CONFIGURE_ME',
                       'benefits', jsonb_build_array('CONFIGURE_ME'), 'useCases', jsonb_build_array('CONFIGURE_ME'),
                       'turnaround', null)),
                     '[{"en": {"title": "CONFIGURE_ME", "description": "CONFIGURE_ME"}},
                       {"en": {"title": "CONFIGURE_ME", "description": "CONFIGURE_ME"}}]'::jsonb,
                     v.position
              FROM (VALUES
                ('sample-silkscreen', 'published', 'silkscreen', 'Sample Silkscreen Printing',
                 '[{"id": "svc-photo-1", "url": "/assets/catalogue/tshirt-colors.jpg", "alt": "Sample Silkscreen Printing"}]',
                 '["t-shirts", "polo-shirts"]', 1),
                ('sample-embroidery', 'published', 'embroidery', 'Sample Embroidery',
                 '[{"id": "svc-photo-2", "url": "/assets/catalogue/polo-ps001.jpg", "alt": "Sample Embroidery"},
                   {"id": "svc-photo-3", "url": "/assets/catalogue/cap-ca001.jpg", "alt": "Sample Embroidery on a cap"}]',
                 '["polo-shirts", "caps-hats"]', 2),
                ('sample-draft-service', 'draft', null, 'Sample Draft Service', '[]', '[]', 3)
              ) AS v(slug, status, method, name, photos, categories, position)
              WHERE NOT EXISTS (SELECT 1 FROM services s WHERE s.slug = v.slug AND s.deleted_at IS NULL);
      rollback:
        - sql:
            sql: DELETE FROM services WHERE slug LIKE 'sample-%';

  - changeSet:
      id: V003-05-local-sample-portfolio
      author: braseth
      context: local
      changes:
        - sql:
            sql: |
              INSERT INTO portfolio_projects (slug, status, category, completed_on, photos, project_text,
                                              client_name, client_name_permitted)
              SELECT v.slug, v.status, v.category, v.completed_on::date, v.photos::jsonb,
                     jsonb_build_object('en', jsonb_build_object('title', v.title, 'summary', 'CONFIGURE_ME',
                                                                 'productType', 'CONFIGURE_ME', 'printMethod', 'CONFIGURE_ME')),
                     v.client_name, v.permitted
              FROM (VALUES
                ('sample-named-project', 'published', 'corporate', '2026-03-01', 'Sample Project With Named Client',
                 '[{"id": "pf-1", "url": "/assets/catalogue/polo.jpg", "alt": "Sample project"}]',
                 'Sample Client (permitted)', true),
                ('sample-unnamed-project', 'published', 't-shirts', '2026-05-01', 'Sample Project Without Permission',
                 '[{"id": "pf-2", "url": "/assets/catalogue/tshirt.jpg", "alt": "Sample project"}]',
                 'Sample Client (not permitted)', false),
                ('sample-undated-project', 'published', 'events', null, 'Sample Undated Project', '[]', null, false),
                ('sample-draft-project', 'draft', 'bags', '2026-06-01', 'Sample Draft Project', '[]', null, false)
              ) AS v(slug, status, category, completed_on, title, photos, client_name, permitted)
              WHERE NOT EXISTS (SELECT 1 FROM portfolio_projects p WHERE p.slug = v.slug AND p.deleted_at IS NULL);
      rollback:
        - sql:
            sql: DELETE FROM portfolio_projects WHERE slug LIKE 'sample-%';
