databaseChangeLog:
  # Sample data for trying the web app on a developer machine. Every changeset
  # here runs ONLY with the Liquibase context "local" (application-local.yaml
  # and the integration tests), never in any other environment.
  - changeSet:
      id: V003-01-local-dev-accounts
      author: braseth
      context: local
      comment: "Sign-in accounts; every password is Braseth-Dev-2026!"
      changes:
        - sql:
            sql: |
              INSERT INTO users (name, email, phone, password_hash, status, email_verified_at, roles,
                                 company_name, telegram, preferred_contact_method)
              SELECT v.name, v.email, v.phone, crypt('Braseth-Dev-2026!', gen_salt('bf', 10)), 'active', NOW(),
                     ARRAY[v.role], v.company, v.telegram, v.contact
              FROM (VALUES
                ('Dev Owner',      'owner@braseth.test',      '+85510900001', 'ROLE_ADMIN',      NULL,          NULL,            'email'),
                ('Dev Customer',   'customer@braseth.test',   '+85510900005', 'ROLE_CUSTOMER',   'Dev Company', '@dev_customer', 'telegram')
              ) AS v(name, email, phone, role, company, telegram, contact)
              WHERE NOT EXISTS (SELECT 1 FROM users u WHERE u.email = v.email);
      rollback:
        - sql:
            sql: DELETE FROM users WHERE email LIKE '%@braseth.test';

  - changeSet:
      id: V003-02-local-sample-catalogue
      author: braseth
      context: local
      comment: >-
        Placeholder products: names say "Sample", prose is CONFIGURE_ME and no
        minimum order is set. Photos are the web app's own /assets files, except
        the cap's, which are in the local MinIO bucket under
        product-media/products/caps-hats/ (uploaded from the cap photo folder;
        they are not in this repository).
      changes:
        - sql:
            sql: |
              -- A sub-category, so filtering by a parent can be seen to include its children.
              INSERT INTO categories (parent_id, name, slug, description, sort_order)
              SELECT c.id, 'Sample Long Sleeve', 'sample-long-sleeve', 'CONFIGURE_ME', 90
              FROM categories c WHERE c.slug = 't-shirts'
                AND NOT EXISTS (SELECT 1 FROM categories WHERE slug = 'sample-long-sleeve');

              INSERT INTO products (category_id, name, slug, sku, short_description, description, web_text,
                                    photos, print_methods, print_positions, maximum_print_colors, is_active, featured)
              SELECT c.id, v.name, v.slug, v.sku, 'CONFIGURE_ME', 'CONFIGURE_ME',
                     jsonb_build_object('en', jsonb_strip_nulls(jsonb_build_object(
                         'name', v.name, 'shortDescription', 'CONFIGURE_ME', 'description', 'CONFIGURE_ME',
                         'material', v.material))),
                     (SELECT coalesce(jsonb_agg(jsonb_build_object('id', gen_random_uuid(), 'url', u.url, 'alt', '')
                                                ORDER BY u.n), '[]')
                      FROM unnest(v.photos) WITH ORDINALITY AS u(url, n)),
                     v.methods, v.positions, v.colours, v.active, v.featured
              FROM (VALUES
                ('t-shirts', 'Sample T-Shirt', 'sample-t-shirt', 'SAMPLE-TS', true, true, '100% Cotton',
                 ARRAY['/assets/catalogue/tshirt.jpg', '/assets/catalogue/tshirt-colors.jpg'],
                 ARRAY['silkscreen', 'heat-transfer'], ARRAY['front', 'back', 'left-sleeve'], 4),
                ('polo-shirts', 'Sample Polo Shirt', 'sample-polo-shirt', 'SAMPLE-PO', true, true, NULL,
                 ARRAY['/assets/catalogue/polo.jpg', '/assets/catalogue/polo-ps001.jpg'],
                 ARRAY['embroidery', 'silkscreen'], ARRAY['pocket'], 6),
                ('hoodies', 'Sample Hoodie', 'sample-hoodie', 'SAMPLE-HO', true, false, NULL,
                 ARRAY['/assets/catalogue/hoodie-ja007.jpg'],
                 ARRAY['silkscreen'], ARRAY[]::text[], NULL),
                ('caps-hats', 'Sample Cap', 'sample-cap', 'SAMPLE-CA', true, false, NULL,
                 ARRAY[]::text[],
                 ARRAY['embroidery'], ARRAY['front'], 6),
                ('sample-long-sleeve', 'Sample Long Sleeve T-Shirt', 'sample-long-sleeve-t-shirt', 'SAMPLE-LS', true, false, NULL,
                 ARRAY['/assets/catalogue/tshirt-longsleeve.jpg'],
                 ARRAY['silkscreen'], ARRAY[]::text[], NULL),
                ('t-shirts', 'Sample Hidden Product', 'sample-hidden-product', 'SAMPLE-HID', false, false, NULL,
                 ARRAY[]::text[], ARRAY[]::text[], ARRAY[]::text[], NULL)
              ) AS v(category_slug, name, slug, sku, active, featured, material, photos, methods, positions, colours)
              JOIN categories c ON c.slug = v.category_slug
              WHERE NOT EXISTS (SELECT 1 FROM products p WHERE p.slug = v.slug);

              -- Garments: three colours and four sizes. The cap: two colours, one size.
              UPDATE products SET
                  colors = (SELECT jsonb_agg(jsonb_build_object('id', gen_random_uuid(), 'name', c.name, 'hex', c.hex) ORDER BY c.n)
                            FROM (VALUES (1, 'White', '#FFFFFF'), (2, 'Black', '#000000'), (3, 'Navy Blue', '#1A237E'))
                                 AS c(n, name, hex)),
                  sizes = (SELECT jsonb_agg(jsonb_build_object('id', gen_random_uuid(), 'label', s.label) ORDER BY s.n)
                           FROM (VALUES (1, 'S'), (2, 'M'), (3, 'L'), (4, 'XL')) AS s(n, label))
              WHERE slug IN ('sample-t-shirt', 'sample-polo-shirt', 'sample-hoodie', 'sample-long-sleeve-t-shirt')
                AND colors = '[]';

              UPDATE products SET
                  colors = (SELECT jsonb_agg(jsonb_build_object('id', gen_random_uuid(), 'name', c.name, 'hex', c.hex) ORDER BY c.n)
                            FROM (VALUES (1, 'Black', '#000000'), (2, 'Red', '#E53935')) AS c(n, name, hex)),
                  sizes = jsonb_build_array(jsonb_build_object('id', gen_random_uuid(), 'label', 'Custom'))
              WHERE slug = 'sample-cap' AND colors = '[]';

              UPDATE products SET photos = (
                  SELECT jsonb_agg(jsonb_build_object(
                             'id', gen_random_uuid(),
                             'url', 'http://localhost:9000/product-media/products/caps-hats/' || f.file,
                             'alt', '') ORDER BY f.n)
                  FROM unnest(ARRAY[
                      'H0f28cfa4182a4de88f10c4035a97ddb7O.jpg', 'H15b55eca342847fc8e1c15877fe3ec299.png',
                      'H27a92802e89b4f25a781b880d66c4e0aK.jpg', 'H2f3e82f990f240ad98a1e54570e0a9c1v.jpg',
                      'H330e5215dee242d3bbbbc0807b54e5e4r.jpg', 'H3d35f865ef8c424c8425236456ae8944v.jpg',
                      'H44f848fda8144069a2bf14e3194177e8D.jpg', 'H485162c70eb14718be7f64c875556deaZ.jpg',
                      'H4ad45dee4f3d4da1b17a612ca047be19i.jpg', 'H53ca6bfba6e148e7a57bebdac42607dfR.jpg',
                      'H599ac73d04a94dab87e7567d262bd9cbi.jpg', 'H5bd8cf9a6fd642258cd7bf261974de08I.jpg',
                      'H6d66cbbe50384c498ce8cb1a878449e1x.jpg', 'H6f8df4ac3de44425912d35b8a4b43e21F.jpg',
                      'H733d5d3970d64020b523aecf0d73c8cbT.jpg', 'H736e41bc31f74176b2b69003a4540389j.jpg',
                      'H754775bc8e384f768a998f382b779d97T.png', 'H779b8c9f6f0c4e7a9a0447ca0a15902fJ.png',
                      'H7bb424418f344827b6ada30e95d500f3A.jpg', 'H88844956ee1e4cf691f032c3a77493e1i.jpg',
                      'H8b9349bb628248828746aa79f78a88a8t.jpg', 'H8ba67d2b9a014f26b0f220c0943b27e8h.jpg',
                      'H8dbfbfb1b4f2467d8f557bae2d61d47da.png', 'H98b82870bef64351954ae4b568f36971X.jpg',
                      'H993422035f9e4dc7a4cb5cc43da6de1cV.jpg', 'H9eb15713ac9c43e284153da9d207bfa14.jpg',
                      'Ha2bd25cb62134e8d93753643e5c548c7W.jpg', 'Ha36bc158ff014988a5a979b00d3a7cccQ.jpg',
                      'Ha4cc907bf49f47c3a262fd04dd549fa8Z.jpg', 'Ha57653035fa04a628110f808b2150676c.jpg',
                      'Ha9ea8a668ba6435a8275d848d648da6ax.jpg', 'Hacd14f41a8ca46628781dcd23b807920b.jpg',
                      'Hafda445083284e7787016641cd62da237.jpg', 'Hb0579a39b5e146cc80a7c92ef9fdf691k.jpg',
                      'Hc10adefb3e70444b89d0b9afdf828025B.jpg', 'Hc76e294755864250bff59bece9c46ab5X.jpg',
                      'Hc9383a6732bf4552922d42a334dee52er.jpg', 'Hcae2f9e06f3b47bfbda2ce5e23fdd4a6A.jpg',
                      'Hcf9cadc6ddf346b9ac093c7b9812ae77x.jpg', 'Hd35c700426d149ce923416788e75dee5E.jpg',
                      'Hd586ec854cff4a498e153b27add449b7I.jpg', 'Hd60d45adc5554e20b1761d001243385ax.jpg',
                      'He161dd1c200b4554abced55708de84ffo.jpg', 'He703f69e2ea54c168e7d6b4d64e42759K.jpg',
                      'He755a7fcaeba4b768980648f0dcc25dcC.jpg', 'He8fd668a4aeb4f5e86f3d8c300520261k.jpg',
                      'Heb054c50d05c4c8082e7bafe0239ae90K.jpg', 'Hf093a0c5edd8474aaa47d0ae64ab3db75.jpg',
                      'Hf402f32ac02144fc8051a13a6045397ey.jpg'
                  ]) WITH ORDINALITY AS f(file, n))
              WHERE slug = 'sample-cap' AND photos = '[]';
      rollback:
        - sql:
            sql: |
              DELETE FROM products WHERE slug LIKE 'sample-%';
